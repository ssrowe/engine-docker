# Promote: moves the mutable tags (4.6.0, 4.6, latest, rc, ...) to one
# published revision, and marks its GitHub Release as a full release. Nothing is
# rebuilt or re-signed: each tag is pointed at the revision's existing, signed
# index digest. Promoting an older revision is how to roll back. The work is
# done by deploy/promote.sh.
#
# A revision isn't promoted while an open issue labelled release-blocker
# mentions its version (4.7.0) or the revision itself (4.7.0-r2), unless force
# is set.
#
# Triggers:    daily at 06:23 UTC, promoting every candidate whose soak has
#              passed (the "Soak: N hours" line in its release notes);
#              manual runs; called by publish.yaml for upstream pre-releases and
#              promote_now.
# Inputs:      version   upstream version, e.g. 4.6.0; empty to do what the daily run does
#              revision  the N in -rN to promote; empty for the newest revision
#              force     promote despite release-blocker issues (manual runs only;
#                        the run log records who did it)
# Permissions: contents: write  edit the GitHub Release and its notes
#              issues: write    comment on release-blocker issues
#              packages: write  move tags in GHCR
# Variables:   IMAGE_REPOS, DOCKERHUB_USERNAME (as for publish.yaml)
#              SOAK_HOURS_FULL  soak for candidates whose notes don't give one (default 168)
# Secrets:     DOCKERHUB_TOKEN  pushes tags; also updates the Docker Hub
#                               description when the latest version is promoted,
#                               which needs Read, Write & Delete. In the "release"
#                               environment, as for publish.yaml.
# Run by hand: gh workflow run promote.yaml -f version=4.6.0 [-f revision=1] [-f force=true]
#              gh workflow run promote.yaml   (promote every candidate that is due, now)
#
# See docs/RELEASING.md, "Promoting", "Blocking a promotion" and "Rolling back".

name: Promote

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Upstream OIE version, e.g. 4.6.0; empty to promote every candidate that is due
        type: string
        default: ""
      revision:
        description: Revision to promote (the N in -rN); empty for the newest
        type: string
        default: ""
      force:
        description: Promote despite open release-blocker issues
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      revision:
        type: string
        default: ""

permissions: {}

env:
  VERSION: ${{ inputs.version }}
  IMAGE_REPOS: ${{ vars.IMAGE_REPOS }}

jobs:
  promote:
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
      issues: write
      packages: write
    # Promotions read and change shared state (which version is latest), so run one at a time.
    concurrency:
      group: promote
      cancel-in-progress: false
    outputs:
      latest_stable: ${{ steps.promote.outputs.latest_stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        if: contains(vars.IMAGE_REPOS, 'docker.io/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: contains(vars.IMAGE_REPOS, 'ghcr.io/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          SOAK_HOURS_FULL: ${{ vars.SOAK_HOURS_FULL || '168' }}
        run: |
          if [ -z "$VERSION" ]; then
            deploy/promote.sh due > "$RUNNER_TEMP/promote.txt"
          else
            echo "$VERSION $REVISION" > "$RUNNER_TEMP/promote.txt"
          fi
          if [ "$FORCE" = true ]; then
            echo "::warning::$GITHUB_ACTOR is promoting $VERSION with force=true, ignoring release-blocker issues"
          fi
          latest=false
          while read -r version revision; do
            out=$(deploy/promote.sh promote "$version" "$revision")
            echo "$out"
            if grep -qx is_latest=true <<< "$out" && [[ $version != *-* ]]; then
              latest=true
            fi
          done < "$RUNNER_TEMP/promote.txt"
          echo "latest_stable=$latest" >> "$GITHUB_OUTPUT"

  dockerhub-description:
    needs: promote
    if: needs.promote.outputs.latest_stable == 'true' && contains(vars.IMAGE_REPOS, 'docker.io/')
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the Docker Hub repository
        id: hub
        run: |
          for repo in $IMAGE_REPOS; do
            if [[ $repo == docker.io/* ]]; then
              echo "repository=${repo#docker.io/}" >> "$GITHUB_OUTPUT"
              break
            fi
          done

      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.hub.outputs.repository }}
          short-description: Open Integration Engine, an open source fork of Mirth Connect
          readme-filepath: README.md
          enable-url-completion: true
