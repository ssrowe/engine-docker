# Publish: builds one upstream OIE version as a new image revision (-rN),
# pushes it to every repository in IMAGE_REPOS under its immutable tags
# (4.6.0-r1, ...), signs it with cosign and records it as a GitHub pre-release:
# the candidate. The mutable tags (4.6.0, 4.6, latest, ...) only move when the
# candidate is promoted by promote.yaml.
#
# Triggers:    manual runs; started by watch.yaml for new upstream releases and
#              rebuilds.
# Inputs:      version      upstream version without the "v", e.g. 4.6.0 or 4.7.0-rc1
#              promote_now  promote as soon as it's published, without a soak.
#                           Upstream pre-releases (4.7.0-rc1) are always promoted at once.
#              soak_hours   how long promote.yaml's daily run waits before promoting
#                           this candidate; empty for SOAK_HOURS_FULL
# Permissions: contents: write  create the GitHub Release (release, promote)
#              issues: write    comment on release-blocker issues (promote)
#              packages: write  push to GHCR (build, merge, promote)
#              id-token: write  sign keylessly with cosign (merge)
# Variables:   IMAGE_REPOS         space-separated repositories to publish to, e.g.
#                                  "docker.io/openintegrationengine/engine ghcr.io/openintegrationengine/engine"
#              DOCKERHUB_USERNAME  Docker Hub user for DOCKERHUB_TOKEN
#              SOAK_HOURS_FULL     default soak in hours (168 if unset)
# Secrets:     DOCKERHUB_TOKEN     Docker Hub access token with Read & Write; jobs that
#                                  use it run in the "release" environment, so upstream
#                                  can limit it to main
# Run by hand: gh workflow run publish.yaml -f version=4.6.0 [-f promote_now=true]
#
# See docs/RELEASING.md, "Publishing".

name: Publish
run-name: Publish ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Upstream OIE version without the "v", e.g. 4.6.0
        required: true
        type: string
      promote_now:
        description: Promote immediately, without a soak
        type: boolean
        default: false
      soak_hours:
        description: Hours to soak before automatic promotion; empty for SOAK_HOURS_FULL
        type: string
        default: ""

permissions: {}

# One publish per version at a time, so two runs can't take the same revision.
concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: OpenIntegrationEngine/engine
  VERSION: ${{ inputs.version }}
  IMAGE_REPOS: ${{ vars.IMAGE_REPOS }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      url: ${{ steps.upstream.outputs.url }}
      sha256: ${{ steps.upstream.outputs.sha256 }}
      prerelease: ${{ steps.upstream.outputs.prerelease }}
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - name: Find the upstream tarball and its checksum
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          SOAK_HOURS: ${{ inputs.soak_hours }}
        run: |
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like 4.6.0 or 4.7.0-rc1, without a v: '$VERSION'"
            exit 1
          fi
          if [ -z "$IMAGE_REPOS" ]; then
            echo "::error::the IMAGE_REPOS variable isn't set"
            exit 1
          fi
          if [ -n "$SOAK_HOURS" ] && ! [[ $SOAK_HOURS =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::soak_hours must be a number of hours: '$SOAK_HOURS'"
            exit 1
          fi
          name=$(gh release view "v$VERSION" -R "$UPSTREAM_REPO" --json assets \
            --jq '[.assets[].name | select(test("^oie_unix_.*\\.tar\\.gz$"))] | first // empty')
          if [ -z "$name" ]; then
            echo "::error::upstream release v$VERSION has no oie_unix_*.tar.gz asset"
            exit 1
          fi
          sha256=$(gh release download "v$VERSION" -R "$UPSTREAM_REPO" -p sha256sums -O - \
            | awk -v f="$name" '$2 == f || $2 == "*" f { print $1 }')
          if ! [[ $sha256 =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::upstream release v$VERSION has no sha256 for $name in sha256sums"
            exit 1
          fi
          {
            echo "url=https://github.com/$UPSTREAM_REPO/releases/download/v$VERSION/$name"
            echo "sha256=$sha256"
            echo "prerelease=$([[ $VERSION == *-* ]] && echo true || echo false)"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Choose the next revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' \
            | sed -n "s/^${VERSION//./\\.}-r\([0-9][0-9]*\)$/\1/p" | sort -n | tail -n 1)
          echo "revision=$(( ${last:-0} + 1 ))" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [jre-noble, jdk-noble, jre-alpine]
        arch: [amd64, arm64]
    env:
      VARIANT: ${{ matrix.variant }}
      PLATFORM: linux/${{ matrix.arch }}
      # docker-bake.hcl variables
      OIE_VERSION: ${{ inputs.version }}
      OIE_RELEASE_URL: ${{ needs.prepare.outputs.url }}
      OIE_RELEASE_SHA256: ${{ needs.prepare.outputs.sha256 }}
      REVISION: ${{ needs.prepare.outputs.revision }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        if: contains(vars.IMAGE_REPOS, 'docker.io/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: contains(vars.IMAGE_REPOS, 'ghcr.io/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # push-by-digest and attestations need the docker-container driver.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # CI only tests the default OIE_VERSION, so test this version before pushing it.
      - name: Build and smoke test
        working-directory: deploy
        run: |
          docker buildx bake "$VARIANT" --set "*.platform=$PLATFORM" --set "*.tags=oie-engine:candidate" --load
          # Pre-releases report their release's version: 4.6.0-rc1 reports 4.6.0.
          ../test/smoke.sh oie-engine:candidate "${OIE_VERSION%%-*}" derby

      # Push this platform untagged to every repository; the merge job joins the
      # platforms into one index and tags it. The build comes from the cache.
      - name: Build and push by digest
        working-directory: deploy
        run: |
          names=$(echo "$IMAGE_REPOS" | xargs | tr ' ' ',')
          docker buildx bake "$VARIANT" \
            --set "*.platform=$PLATFORM" \
            --set "*.tags=" \
            --set "*.output=type=image,\"name=$names\",push-by-digest=true,name-canonical=true,push=true" \
            --set "*.attest=type=sbom" \
            --set "*.attest=type=provenance,mode=max,builder-id=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --metadata-file "$RUNNER_TEMP/metadata.json"
          digest=$(jq -r --arg t "$VARIANT" '.[$t]["containerimage.digest"]' "$RUNNER_TEMP/metadata.json")
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        variant: [jre-noble, jdk-noble, jre-alpine]
    env:
      VARIANT: ${{ matrix.variant }}
      REVISION: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Log in to Docker Hub
        if: contains(vars.IMAGE_REPOS, 'docker.io/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: contains(vars.IMAGE_REPOS, 'ghcr.io/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Tag the multi-platform index and sign it
        run: |
          mapfile -t tags < <(deploy/tags.sh immutable "$VERSION" "$REVISION" "$VARIANT")
          for repo in $IMAGE_REPOS; do
            args=()
            for tag in "${tags[@]}"; do
              args+=(-t "$repo:$tag")
            done
            for digest in "$RUNNER_TEMP"/digests/*; do
              args+=("$repo@sha256:${digest##*/}")
            done
            docker buildx imagetools create "${args[@]}"
            index=$(docker buildx imagetools inspect "$repo:${tags[0]}" --format '{{json .Manifest}}' | jq -r .digest)
            # cosign stores the signature in the image's own registry, so sign in each one.
            cosign sign --yes "$repo@$index"
            echo "$repo@$index" >> "$RUNNER_TEMP/index-$VARIANT.txt"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index-${{ matrix.variant }}
          path: ${{ runner.temp }}/index-${{ matrix.variant }}.txt
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [prepare, merge]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      REVISION: ${{ needs.prepare.outputs.revision }}
      OIE_RELEASE_URL: ${{ needs.prepare.outputs.url }}
      OIE_RELEASE_SHA256: ${{ needs.prepare.outputs.sha256 }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      SOAK_HOURS: ${{ inputs.soak_hours || vars.SOAK_HOURS_FULL || '168' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: index-*
          path: ${{ runner.temp }}/index

      - name: Create the candidate pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$VERSION-r$REVISION"
          first_repo=${IMAGE_REPOS%% *}
          signer="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/publish.yaml@$GITHUB_REF"
          {
            echo "Open Integration Engine $VERSION, image revision $REVISION, built from engine-docker $GITHUB_SHA."
            echo
            echo "Candidate since: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            # promote.sh reads this line to decide when the soak is over.
            if [ "$PRERELEASE" = true ]; then
              echo "Soak: 0 hours"
            else
              echo "Soak: $SOAK_HOURS hours"
            fi
            echo
            echo "Promoted automatically once the soak is over, unless an open issue labelled \`release-blocker\` mentions \`$VERSION\` or \`$tag\`."
            echo
            echo "### Images"
            for variant in jre-noble jdk-noble jre-alpine; do
              echo
              echo "**$variant**: $(deploy/tags.sh immutable "$VERSION" "$REVISION" "$variant" | sed "s/.*/\`&\`/" | paste -sd ' ')"
              sed "s/.*/- \`&\`/" "$RUNNER_TEMP/index/index-$variant/index-$variant.txt"
            done
            echo
            echo "### Built from"
            echo "- Upstream tarball: $OIE_RELEASE_URL"
            echo "- SHA-256: \`$OIE_RELEASE_SHA256\`"
            (cd deploy && docker buildx bake --print 2> /dev/null) \
              | jq -r '[.target[].args.BASE_IMAGE] | unique[] | "- Base image: `\(.)`"'
            echo
            echo "### Testing this candidate"
            echo "- [ ] Pull \`$first_repo:$(deploy/tags.sh immutable "$VERSION" "$REVISION" jre-noble | head -n 1)\` (or another variant above) and run it with your usual configuration."
            echo "- [ ] Check the signature:"
            echo "  \`cosign verify $first_repo:$(deploy/tags.sh immutable "$VERSION" "$REVISION" jre-noble | head -n 1) --certificate-identity $signer --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
            echo "- [ ] Report anything that breaks with the [image candidate problem]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/new?template=image-candidate-problem.yml) issue template."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --prerelease --latest=false \
            --notes-file "$RUNNER_TEMP/notes.md"

  promote:
    needs: [prepare, release]
    if: needs.prepare.outputs.prerelease == 'true' || inputs.promote_now
    permissions:
      contents: write
      issues: write
      packages: write
    uses: ./.github/workflows/promote.yaml
    with:
      version: ${{ inputs.version }}
      revision: ${{ needs.prepare.outputs.revision }}
    secrets: inherit
